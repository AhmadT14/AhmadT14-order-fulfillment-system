name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit

  build-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
        working-directory: services/inventory
      - name: Lint
        run: npm run lint
        working-directory: services/inventory
      - name: Type check
        run: npx tsc --noEmit
        working-directory: services/inventory

  build-notification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
        working-directory: services/notification
      - name: Lint
        run: npm run lint
        working-directory: services/notification
      - name: Type check
        run: npx tsc --noEmit
        working-directory: services/notification
